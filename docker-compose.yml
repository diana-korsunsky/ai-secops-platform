services:
  postgres:
    image: postgres:17
    container_name: secops-postgres

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: secops-redis

    ports:
      - "127.0.0.1:6379:6379"

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}



volumes:
  postgres_data:

